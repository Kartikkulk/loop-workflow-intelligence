name: CI

# Three independent jobs, one per ownership boundary. A frontend PR does not
# wait on the Python suite, and a backend PR does not wait on Next's build —
# which matters when three people are pushing against a deadline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api · ruff + pytest + contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: .venv/bin/python -m ruff check app scripts tests

      - name: Tests
        run: .venv/bin/python -m pytest -q

      # Fails if the committed contract does not match the code, so a change to
      # the API surface cannot merge invisibly to whoever consumes it.
      - name: API contract is up to date
        run: .venv/bin/python scripts/export_openapi.py --check

  web:
    name: web · tsc + eslint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      # Builds in mock mode, so the frontend job never needs a live backend.
      - name: Build
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_API_MOCK: "1"
          NEXT_TELEMETRY_DISABLED: "1"

  collector:
    name: collector · background + content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Service worker tests
        run: node collectors/tests/background.test.mjs

      # The content-script test drives real Chrome, which the runner provides.
      - name: Content script tests
        run: node collectors/tests/content.test.mjs

  smoke:
    name: smoke · seed, detect, replay, promote
    runs-on: ubuntu-latest
    needs: [api]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      # The demo path itself, end to end. A green unit suite with a broken
      # `make demo` is worthless four days before a submission.
      - name: Seed and verify the demo state
        run: |
          .venv/bin/python scripts/seed.py
          .venv/bin/python - <<'PY'
          import asyncio, json
          from app.db.session import SessionLocal
          from app.models.cluster import Cluster
          from sqlalchemy import select

          async def main():
              async with SessionLocal() as s:
                  clusters = list((await s.execute(select(Cluster))).scalars().all())
              assert clusters, "detection produced no clusters"
              blocked = [c for c in clusters if c.do_not_automate]
              assert blocked, "no workflow was flagged DO NOT AUTOMATE"
              print(json.dumps({
                  "clusters": len(clusters),
                  "do_not_automate": len(blocked),
                  "hours": round(sum(c.annual_hours for c in clusters), 1),
              }))

          asyncio.run(main())
          PY
