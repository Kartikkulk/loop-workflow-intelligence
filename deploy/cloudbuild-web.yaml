# Build the console image.
#
#   gcloud builds submit --config deploy/cloudbuild-web.yaml \
#     --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/loop/loop-web:v1,\
# _API_BASE=https://loop-api-xxxx.run.app .
#
# The API URL is a *build* argument, not a runtime one. Next inlines every
# NEXT_PUBLIC_* value into the JavaScript bundle when it compiles, so setting it
# on the Cloud Run service after the fact changes nothing — the shipped bundle
# would still be calling localhost:8000 from the user's browser.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_BASE=${_API_BASE}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
