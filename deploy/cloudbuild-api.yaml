# Build the API image.
#
#   gcloud builds submit --config deploy/cloudbuild-api.yaml \
#     --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/loop/loop-api:v1 .
#
# Built here rather than with `gcloud run deploy --source` because the
# repository is a monorepo: the build context has to be the root (the API
# imports from it) while the Dockerfile lives in apps/api. `--source` assumes
# the two are the same directory, and there is no flag that separates them.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
