[project]
name = "loop-api"
version = "0.1.0"
description = "LOOP — workflow intelligence platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
embeddings = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
