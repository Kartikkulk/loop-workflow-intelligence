# Full stack in containers. Postgres is used here rather than the SQLite
# default, so `docker compose up` also exercises the Postgres code path.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports:
      - "5432:5432"
    volumes:
      - loop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Where automations actually run. Kriyā AI works out what repeats and whether it
  # is safe to hand over; n8n already has the connectors and the credential
  # handling, so a discovered workflow is exported into it rather than having a
  # twelfth connector written by hand.
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      # Local-only by default, matching the rest of the stack. Turn auth on
      # before this is reachable by anything but this machine.
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${LOOP_TIMEZONE:-Asia/Kolkata}
      # The public REST API is what Kriyā AI pushes workflows to.
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - loop-n8n:/home/node/.n8n
      # Invoices live on the host, so the workflow n8n runs can reach the same
      # files the automation was detected from.
      - ${LOOP_FILES_ROOT:-~/Kriya-Invoices}:/data/invoices

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Everything else in .env reaches the API through this — detection floors,
    # scoring weights, credentials. The explicit values below still win, and
    # they are the ones whose host-shaped form is wrong inside a container.
    env_file:
      - path: .env
        required: false
    environment:
      # Falls back to the bundled Postgres, but a hosted URL in .env wins — the
      # point of pointing at Neon is that the data outlives `docker compose down`.
      LOOP_DATABASE_URL: ${LOOP_DATABASE_URL:-postgresql+asyncpg://loop:loop@postgres:5432/loop}
      LOOP_ENABLE_MOCK_CONNECTORS: "true"
      LOOP_LLM_PROVIDER: ollama
      LOOP_LLM_MODEL: ${LOOP_LLM_MODEL:-qwen2.5:1.5b-instruct}
      # Deliberately NOT ${LOOP_OLLAMA_BASE_URL}. That variable holds the host's
      # view — localhost:11434 — which inside this container resolves to the
      # container itself, so reading it here would silently point the API at
      # nothing and every AI call would take the fallback path. Ollama must also
      # be started as `OLLAMA_HOST=0.0.0.0:11434 ollama serve`; bound to
      # loopback it refuses connections from the container.
      LOOP_OLLAMA_BASE_URL: ${LOOP_OLLAMA_BASE_URL_IN_DOCKER:-http://host.docker.internal:11434}
      LOOP_OLLAMA_VISION_MODEL: ${LOOP_OLLAMA_VISION_MODEL:-}
      # n8n is a sibling service here, so the default of localhost:5678 would
      # point the API at itself. The key comes from .env — pushing a workflow
      # needs it, and it is created inside n8n rather than shipped with the repo.
      LOOP_N8N_BASE_URL: http://n8n:5678
      # The same n8n as the browser reaches it. `n8n:5678` is resolvable only
      # on the compose network, so a link built from it fails in the browser.
      LOOP_N8N_PUBLIC_URL: ${LOOP_N8N_PUBLIC_URL:-http://localhost:5678}
      LOOP_N8N_API_KEY: ${LOOP_N8N_API_KEY:-}
      LOOP_FILES_ROOT: /data/invoices
      LOOP_SEED_ON_BOOT: ${LOOP_SEED_ON_BOOT:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    # The same invoices n8n sees, at the same path, so a file automation
    # resolves identically on both sides of the export.
    volumes:
      - ${LOOP_FILES_ROOT:-~/Kriya-Invoices}:/data/invoices
    # Seed on boot so a clean clone has data to show immediately. Set
    # LOOP_SEED_ON_BOOT=false once the database holds real observed activity —
    # otherwise every restart replaces it with the synthetic set.
    command: >
      sh -c "if [ \"$$LOOP_SEED_ON_BOOT\" != \"false\" ]; then python scripts/seed.py; fi &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Resolved in the browser, so it must be the host address, not `api`.
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  loop-n8n:
  loop-pgdata:
